@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Schibsted+Grotesk:wght@400;500;600;700&family=Lato:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap');

.pl-root{
  --paper:#EEF5F1; --surface:#FFFFFF; --card:#FFFFFF;
  --pine:#0A6B45; --pine-2:#0C8457; --pine-deep:#064A30;
  --needle:#3FB57D; --needle-soft:#A6DEC2;
  --resin:#E0951F; --resin-soft:#FDEFD6; --resin-ink:#9A5B00;
  --ink:#0E1B15; --muted:#45554D; --faint:#7E8C85;
  --line:#D5E2DA; --line-2:#E6EFEA;
  --alert:#C8452D; --alert-soft:#FCE6E0; --ok:#0C8457; --ok-soft:#DDF4E8; --info:#2F6FA0; --info-soft:#E1EEF8;
  --c-noon:#E0951F; --c-shopify:#0A6B45; --c-app:#3FB57D; --c-namshi:#2F6FA0;
  --fs-body:clamp(15.5px, 0.25vw + 14.4px, 17px);
  --fs-small:clamp(13px, 0.15vw + 12.4px, 14px);
  --fs-ui:clamp(14.5px, 0.2vw + 13.7px, 16px);
  --fs-lead:clamp(17px, 0.45vw + 15.2px, 20px);
  --fs-h1:clamp(36px, 4.3vw, 58px);
  --fs-h2:clamp(30px, 3.4vw + 8px, 54px);
  --fs-h3:clamp(25px, 1.6vw + 12px, 34px);
  /* TYPE SYSTEM (applies to the whole site)
     Serif (Newsreader) is used only for headings and key statements; everything else is sans (Schibsted Grotesk).
     H1 hero      serif 600  --fs-h1   brand green
     H2 section   serif 500  --t-h2    brand green
     Key line     serif 600  --t-h3    brand green   (fold 4 problem line)
     Card headline serif 600 22-30px   brand green   (fold 6 right card)
     Kicker       sans 700   --t-title brighter green
     Lead         sans 400   --t-lead  muted
     Title        sans 600   --t-title ink         (list titles, FAQ questions, role names)
     Body         sans 400   --t-body  muted
     Small        sans 400/600 13px    muted/faint (captions, pointers, notes)
     Button       sans 600   14.5px, 40px tall    (every "Book a demo") */
  --t-h2:clamp(28px, min(2.7vw, 4.6vh), 40px);
  --t-h3:clamp(19px, min(1.5vw, 2.7vh), 24px);
  --t-lead:clamp(15px, min(1.1vw, 1.95vh), 17px);
  --t-title:clamp(14.5px, min(1.05vw, 1.85vh), 16px);
  --t-body:clamp(13.5px, min(.98vw, 1.75vh), 15px);
  --t-small:13px;
  --t-micro:12px;
  --serif:'Newsreader', Georgia, 'Times New Roman', serif;
  --sans:'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif;
  font-family:var(--sans); color:var(--ink); background:#FFFFFF;
  font-size:var(--fs-body); line-height:1.6; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:clip;
}
:where(.pl-root) *,:where(.pl-root) *::before,:where(.pl-root) *::after{box-sizing:border-box}
:where(.pl-root) :where(h1,h2,h3,h4,p,figure,dl,dd,ol,ul,address){margin:0;padding:0}
:where(.pl-root) :where(ol,ul){list-style:none}
:where(.pl-root) a{color:inherit}
:where(.pl-root) button{font:inherit}
.pl-root :focus-visible{outline:2px solid var(--resin);outline-offset:3px;border-radius:6px}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}

.pl-wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.pl-sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.4}
.pl-voice{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.45;color:var(--ink)}
.pl-voice-sm{font-size:15px;color:var(--muted)}

/* Logo */
.pl-logo{display:inline-flex;align-items:center;gap:10px;color:var(--pine);text-decoration:none}
.pl-logo-word{font-family:var(--serif);font-size:25px;font-weight:500;letter-spacing:-0.01em;line-height:1}
.pl-logo.is-inverse{color:#fff}
.pl-logo-img{height:30px;width:auto;display:block}

/* Buttons */
.pl-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:999px;font-family:var(--sans);font-weight:600;font-size:15.5px;line-height:1;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color .2s ease,border-color .2s ease,color .2s ease}
.pl-btn-primary{background:var(--pine);color:#fff}
.pl-btn-primary:hover{background:var(--pine-2)}
.pl-btn-ghost{background:transparent;color:var(--pine);border-color:rgba(23,58,44,.3)}
.pl-btn-ghost:hover{border-color:var(--pine);background:rgba(23,58,44,.04)}
.pl-btn-sm{height:40px;padding:0 18px;font-size:14.5px}
.pl-btn-block{width:100%}

/* Nav */
.pl-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s ease}
.pl-nav.is-scrolled{border-bottom:2px solid var(--pine)}
.pl-nav-in{display:flex;align-items:center;justify-content:space-between;height:72px;gap:24px}
.pl-nav-logo{text-decoration:none;display:inline-flex}
.pl-nav-links{display:flex;gap:32px}
.pl-nav-links a{font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;transition:color .15s}
.pl-nav-links a:hover{color:var(--pine)}
.pl-nav-cta{display:flex;align-items:center;gap:10px}
.pl-menu-btn{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--pine);cursor:pointer;align-items:center;justify-content:center}
.pl-mobile-menu{display:none}

/* Hero */
.pl-hero{padding:10px 0 0;min-height:calc(100svh - 72px);display:flex;flex-direction:column}
.pl-hero > .pl-wrap{width:100%}
.pl-hero-main{flex:1;padding-bottom:4px;display:grid;grid-template-columns:minmax(0,1fr) min(651px,58%);gap:32px;align-items:center}
.pl-hero-copy{padding:16px 0}
.pl-eyebrow{display:inline-flex;align-items:center;gap:10px;padding:5px 14px;border-radius:999px;background:#E8F5EE;border:1px solid var(--line-2);font-size:12px;font-weight:600;color:var(--pine);line-height:1.3;margin-bottom:28px}
.pl-hero-copy{container-type:inline-size;min-width:0}
.pl-h1{font-family:var(--serif);font-weight:600;font-size:min(var(--fs-h1),11.8cqi);line-height:1;letter-spacing:-0.025em;color:var(--pine)}
.pl-h1 span{display:block;white-space:nowrap}
.pl-hero-lead{font-size:var(--t-lead);line-height:1.6;color:var(--muted);max-width:31em;margin-top:24px;text-wrap:pretty}
.pl-hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px}
.pl-hero-visual{min-width:0}

/* Hero visual: five clusters on a star, flowing into Pineloop */
.pl-hv{position:relative;width:100%;max-width:651px;margin:0 0 0 auto}
.pl-hv{display:flex;justify-content:flex-end}
/* The visual and its insight share one column, so the insight is always centred under the visual */
.pl-hv-col{display:flex;flex-direction:column;width:fit-content;max-width:100%}
.pl-hv-insight-row{width:0;min-width:100%;display:flex;justify-content:center}
.pl-hv-star{position:relative;width:700px;height:510px}
.pl-hv-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.pl-hv-line{fill:none;stroke:#B4C6BA;stroke-width:1.3;stroke-dasharray:3 4;transition:stroke .3s ease}
.pl-hv-line.is-active{stroke:var(--resin);stroke-width:1.7;stroke-dasharray:none}
.pl-hv-line.is-out{stroke:var(--pine-2);stroke-dasharray:none;stroke-width:1.5}
.pl-hv-dot{fill:var(--pine-2)}
.pl-hv-dot.is-active,.pl-hv-dot.is-out{fill:var(--resin)}
.pl-hv-chip{position:absolute;z-index:1;transform:translate(-50%,-50%);width:92px;height:36px;display:flex;align-items:center;justify-content:center;gap:5px;background:#fff;border:1px solid var(--line-2);border-radius:8px;box-shadow:0 1px 2px rgba(15,42,31,.05);transition:border-color .3s ease,box-shadow .3s ease,transform .3s ease}
.pl-hv-chip img{width:86%;height:68%;object-fit:contain;display:block}
.pl-hv-chip.has-suffix{padding:0 5px}
.pl-hv-chip.has-suffix img{width:auto;height:12px}
.pl-hv-suffix{font-size:12px;font-weight:700;color:#111;line-height:1}
.pl-hv-chip.is-text{padding:0 6px;font-size:12px;font-weight:600;line-height:1.1;color:var(--pine);text-align:center}
.pl-hv-chip.is-wide{padding:0 6px;font-size:12.5px;white-space:nowrap}
.pl-hv-chip.is-wide svg{flex:none;color:var(--pine-2)}
.pl-hv-chip.is-active{border-color:var(--resin);box-shadow:0 0 0 2px rgba(200,137,46,.2);transform:translate(-50%,-50%) scale(1.08)}
.pl-hv-hub{position:absolute;z-index:2;transform:translate(-50%,-50%);display:grid;place-items:center}
.pl-hv-core{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--line-2);box-shadow:0 10px 24px -8px rgba(15,42,31,.35)}
.pl-hv-core .pl-logo{gap:7px}
.pl-hv-core .pl-logo svg{width:26px;height:26px}
.pl-hv-core .pl-logo-word{font-size:21px}
.pl-hv-core .pl-logo-img{height:22px}
.pl-hv-pulse{position:absolute;inset:0;border-radius:999px;background:var(--pine);opacity:0;animation:plPulse 2.8s ease-out infinite}
.pl-hv-pulse.is-late{animation-delay:1.4s}
.pl-hv-insight{position:relative;z-index:1;width:fit-content;max-width:100%;margin:0 auto;display:flex;align-items:center;justify-content:center;text-align:center;gap:10px;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(15,42,31,.05),0 8px 20px -12px rgba(15,42,31,.2)}
.pl-hv-insight p{min-width:0;font-size:12px;font-weight:600;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:plRise .45s cubic-bezier(.2,.7,.2,1) both}
.pl-hv-kind{flex:none;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:10.5px;font-weight:700;animation:plFade .4s ease both}
.pl-hv-kind.is-alert{background:var(--alert-soft);color:var(--alert)}
.pl-hv-kind.is-resin{background:var(--resin-soft);color:var(--resin-ink)}
.pl-hv-kind.is-ok{background:var(--ok-soft);color:var(--ok)}
@keyframes plPulse{0%{transform:scale(1);opacity:.16}100%{transform:scale(1.16,1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.pl-hv-pulse,.pl-hv-insight p,.pl-hv-kind{animation:none}}

/* Customer logos: dark green strip, label on top, logos moving across on white tiles */
.pl-trusted-strip{background:var(--pine);padding:clamp(12px,1.8vh,16px) 0 clamp(14px,2.1vh,18px);margin-bottom:1px;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.3vh,12px)}
.pl-trusted-l{font-size:13px;font-weight:400;letter-spacing:.06em;color:#FFFFFF;text-align:center}
.pl-marquee{width:80%;margin:0 auto;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%)}
.pl-marquee-track{display:flex;align-items:center;width:max-content;animation:plMarquee 34s linear infinite}
.pl-marquee:hover .pl-marquee-track{animation-play-state:paused}
/* Each slot is a fifth of the screen plus a little, so one full set of five logos is always wider than the screen
   and the same logo never appears twice at once. Logos move only within the central 80% of the strip. */
.pl-logo-tile{flex:none;width:calc((max(80vw, 300px) + 100px) / 5);display:flex;justify-content:center}
.pl-logo-circle{width:clamp(64px,8.4vh,78px);height:clamp(64px,8.4vh,78px);border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px -6px rgba(0,0,0,.35)}
.pl-logo-circle img{width:76%;height:76%;object-fit:contain;display:block}
@keyframes plMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.pl-marquee-track{animation:none}}

.pl-hero-stage{position:relative;padding:24px 0 56px}
.pl-hero-stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--pine);z-index:0}
.pl-hero-stage .pl-wrap{position:relative;z-index:1}
.pl-connects{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;margin-top:36px;color:rgba(255,255,255,.72);font-size:14.5px}
.pl-connects-l{color:#fff;font-weight:600}

/* Sections */
.pl-section{padding:128px 0;scroll-margin-top:72px}
.pl-surface{background:#FFFFFF}
.pl-section.pl-surface,.pl-demo{border-top:1px solid var(--line-2)}
.pl-h2{font-family:var(--serif);font-weight:500;font-size:var(--fs-h2);line-height:1.08;letter-spacing:-0.018em;color:var(--pine);max-width:17em;text-wrap:balance}
.pl-h3{font-family:var(--serif);font-weight:400;font-size:var(--fs-h3);line-height:1.14;letter-spacing:-0.01em;color:var(--pine);text-wrap:balance}
.pl-h2-split span{display:block}
.pl-lead{font-size:var(--t-lead);line-height:1.6;color:var(--muted);max-width:36em;margin-top:24px}

/* Screen frame */
.pl-screen{background:var(--card);border-radius:14px;border:1px solid #E1E5DF;box-shadow:0 1px 2px rgba(15,42,31,.05),0 10px 28px -10px rgba(15,42,31,.12),0 28px 56px -32px rgba(15,42,31,.2);overflow:hidden;font-size:14px;line-height:1.45;color:var(--ink);text-align:left}
.pl-screen-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:46px;padding:0 16px;border-bottom:1px solid var(--line-2);background:#F8FBF9}
.pl-screen-title{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-screen-meta{display:inline-flex;align-items:center;gap:8px;flex:none}
.pl-screen-app{font-size:12.5px;color:var(--muted)}
.pl-sample{font-size:12px;color:var(--muted);background:var(--paper);border-radius:999px;padding:3px 10px;white-space:nowrap}
.pl-chips{display:flex;gap:6px;flex-wrap:wrap}
.pl-chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink);white-space:nowrap}
.pl-mini-btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--pine);white-space:nowrap;cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.pl-mini-btn:hover{border-color:var(--pine)}
.pl-mini-btn.is-primary{background:var(--pine);border-color:var(--pine);color:#fff}
.pl-mini-btn.is-primary:hover{background:var(--pine-2)}
.pl-mini-btn.is-done,.pl-mini-btn.is-done:hover{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.pl-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
.pl-dot.is-ok{background:var(--ok)} .pl-dot.is-warn{background:var(--resin)} .pl-dot.is-alert{background:var(--alert)}
.pl-avatar{display:inline-grid;place-items:center;border-radius:50%;background:var(--pine);flex:none}
.pl-tag{display:inline-flex;align-items:center;height:22px;font-size:11.5px;font-weight:600;padding:0 8px;border-radius:999px;white-space:nowrap}
.pl-tag.is-ok{background:var(--ok-soft);color:var(--ok)}
.pl-tag.is-hyp{background:var(--resin-soft);color:var(--resin-ink)}
.pl-tag.is-muted{background:var(--paper);color:var(--muted)}
.pl-rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--paper);font-size:12px;font-weight:700;color:var(--pine);flex:none}
.pl-kind{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.pl-kind.is-resin{color:var(--resin-ink)} .pl-kind.is-alert{color:var(--alert)} .pl-kind.is-pine{color:var(--pine)}
.pl-status{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pl-status.is-ok{background:var(--ok-soft);color:var(--ok)}
.pl-status.is-warn{background:var(--resin-soft);color:var(--resin-ink)}
.pl-status.is-alert{background:var(--alert-soft);color:var(--alert)}
.pl-status.is-info{background:var(--info-soft);color:var(--info)}
.pl-status.is-wait{background:var(--pine);color:#fff}

/* Hero workspace */
.pl-ws{display:grid;grid-template-columns:200px minmax(0,1fr) 272px;min-height:600px}
.pl-ws-side{background:#F4F9F6;border-right:1px solid var(--line-2);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.pl-ws-nav{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:13.5px;white-space:nowrap}
.pl-ws-nav.is-active{background:#fff;color:var(--pine);font-weight:600;box-shadow:0 0 0 1px var(--line-2)}
.pl-ws-badge{margin-left:auto;background:var(--resin);color:#fff;font-size:11px;line-height:18px;border-radius:999px;padding:0 7px;font-weight:700}
.pl-ws-health{margin-top:auto;font-size:12.5px;color:var(--ink);padding:14px 10px 4px;border-top:1px solid var(--line-2);display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.pl-ws-health-sub{flex-basis:100%;color:var(--muted);font-size:12px;padding-left:15px}
.pl-ws-main{padding:18px 24px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pl-ws-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pl-ws-h{font-size:15px;color:var(--ink)}
.pl-msg-user{align-self:flex-end;background:var(--pine);color:#fff;padding:10px 14px;border-radius:14px 14px 4px 14px;max-width:82%;font-size:14px;line-height:1.45}
.pl-msg-pine{display:flex;gap:12px;align-items:flex-start;min-width:0}
.pl-msg-body{position:relative;flex:1;min-width:0}
.pl-answer-card{border:1px solid var(--line-2);border-radius:12px;padding:16px 16px 12px;margin-top:12px;background:#fff}
.pl-waterfall{width:100%;height:auto;display:block}
.pl-wf-val{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.pl-wf-val.is-flag{fill:var(--resin-ink)}
.pl-wf-lab{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.pl-drivers{margin-top:6px}
.pl-driver{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line-2);align-items:start;font-size:13.5px}
.pl-driver strong{font-weight:600}
.pl-driver-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pl-impact{font-size:13px;font-weight:700;color:var(--alert)}
.pl-sources{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-top:10px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.pl-sources-lab{font-weight:600;color:var(--ink)}
.pl-src{display:inline-flex;align-items:center;gap:6px}
.pl-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pl-ws-today{border-left:1px solid var(--line-2);padding:18px 16px;background:#FAFDFB;display:flex;flex-direction:column;gap:12px}
.pl-today-head{display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
.pl-today-head strong{font-size:15px}
.pl-today-head span{font-size:12px;color:var(--muted)}
.pl-today-item{border:1px solid var(--line-2);border-radius:10px;padding:12px;background:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.pl-today-item p{font-size:13px;line-height:1.45}

/* Typing sequence (single orchestrated moment on load) */
.pl-typing{position:absolute;top:2px;left:0;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);opacity:0;pointer-events:none}
.pl-typing-dots{display:inline-flex;gap:4px}
.pl-typing-dots i{width:5px;height:5px;border-radius:50%;background:var(--needle);display:block}
.pl-anim .pl-a-q{animation:plRise .5s cubic-bezier(.2,.7,.2,1) .3s both}
.pl-anim .pl-typing{animation:plTyping 1.5s ease .8s both}
.pl-anim .pl-typing-dots i{animation:plBlink 1s ease-in-out infinite}
.pl-anim .pl-typing-dots i:nth-child(2){animation-delay:.15s}
.pl-anim .pl-typing-dots i:nth-child(3){animation-delay:.3s}
.pl-anim .pl-a-answer{animation:plFade .5s ease 2.2s both}
.pl-anim .pl-a-d1{animation:plRise .45s ease 3.1s both}
.pl-anim .pl-a-d2{animation:plRise .45s ease 3.25s both}
.pl-anim .pl-a-d3{animation:plRise .45s ease 3.4s both}
.pl-grow{transform-box:fill-box;transform-origin:50% 100%;animation:plGrow .55s cubic-bezier(.2,.7,.2,1) both}
.pl-grow.is-down{transform-origin:50% 0%}
.pl-fade{animation:plFade .4s ease both}
.pl-ws.is-waiting *{animation-play-state:paused !important}
@keyframes plRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes plFade{from{opacity:0}to{opacity:1}}
@keyframes plGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes plTyping{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes plBlink{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .pl-anim *,.pl-grow,.pl-fade{animation:none !important}
  .pl-typing{display:none}
}

/* Meet Pine */
.pl-pine-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:72px;align-items:start}
.pl-traits{margin-top:44px;display:grid;gap:0;border-top:1px solid var(--line)}
.pl-traits > div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}
.pl-traits dt{font-family:var(--serif);font-style:italic;font-size:clamp(22px,1.9vw,26px);line-height:1.1;color:var(--pine)}
.pl-traits dd{font-size:var(--fs-body);color:var(--ink);line-height:1.55}
.pl-thread{padding:8px 0 12px}
.pl-tmsg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:10px 18px}
.pl-tmsg p{font-size:14px;line-height:1.5}
.pl-person{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;font-weight:700;font-size:13px}
.pl-tmsg .pl-avatar{border-radius:8px}
.pl-tmeta{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:2px}
.pl-tmeta span{font-size:12px;color:var(--faint)}
.pl-tmeta .pl-app-tag{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--paper);border-radius:4px;padding:1px 5px}
.pl-mention{background:#E6EFE9;color:var(--pine);border-radius:4px;padding:0 3px;font-weight:600}
.pl-tlist{margin-top:8px;display:grid;gap:7px}
.pl-tlist li{display:grid;grid-template-columns:7px minmax(0,1fr);gap:10px;align-items:baseline;font-size:14px;line-height:1.5}
.pl-tlist .pl-dot{transform:translateY(-1px)}
.pl-tcard{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid var(--line-2);border-left:3px solid var(--pine);border-radius:8px;background:#FAFDFB;font-size:13.5px}
.pl-tcard svg{flex:none;margin-top:1px}
.pl-reacts{display:flex;gap:6px;margin-top:10px}
.pl-reacts span{font-size:12px;border:1px solid var(--line-2);border-radius:999px;padding:2px 8px;color:var(--muted);background:#fff}
.pl-nudges{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.pl-nudge{background:#fff;border:1px solid #E1E5DF;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgba(15,42,31,.05),0 10px 24px -12px rgba(15,42,31,.16)}
.pl-nudge-h{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.pl-nudge p{font-size:13.5px;line-height:1.5}
.pl-nudge-btns{display:flex;gap:8px;margin-top:auto}
.pl-nudge-btns .pl-mini-btn{height:28px;padding:0 10px}
.pl-does{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px;margin-top:96px;padding-top:48px;border-top:1px solid var(--line)}
.pl-does h3,.pl-role h3{font-family:var(--sans);font-size:18px;font-weight:600;color:var(--ink);margin-top:14px;line-height:1.3}
.pl-does p,.pl-role p{font-size:var(--fs-ui);color:var(--muted);margin-top:8px;line-height:1.55}
.pl-does-i,.pl-role-i{color:var(--pine)}
/* Fold 2: product view on one screen */
.pl-showcase{min-height:calc(100svh - 72px);display:flex;flex-direction:column;justify-content:center;position:relative}
.pl-showcase{background:#FFFFFF}
.pl-showcase .pl-hero-stage{padding:24px 0}
.pl-showcase .pl-screen-hero{border:1px solid rgba(6,74,48,.42);box-shadow:12px 14px 30px -12px rgba(6,40,26,.32),2px 3px 8px -2px rgba(6,40,26,.12)}
.pl-showcase .pl-hero-stage::before{display:none}
.pl-fit{position:relative;width:100%}
.pl-fit.is-on{display:flex;justify-content:center;align-items:flex-start}
.pl-fit.is-on .pl-fit-inner{flex:none;width:100%;transform-origin:top center}
.pl-fit.is-on.is-wrap .pl-fit-inner{width:max-content}
.pl-fit.is-on.is-end{justify-content:flex-end}
.pl-fit.is-on.is-end .pl-fit-inner{transform-origin:top right}
.pl-fit.is-on.is-hug{display:block;overflow:visible}
.pl-fit.is-on.is-hug .pl-fit-inner{transform-origin:top left}

/* One-screen folds: the content row always spans the full page width */
.pl-fold3 > .pl-wrap,.pl-fold4 > .pl-wrap,.pl-fold6 > .pl-wrap{width:100%}

/* Fold 3: Meet Pine on one screen */
.pl-fold3{min-height:calc(100svh - 72px);display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,3.6vh,44px) 0}
.pl-fold3 .pl-pine-grid{grid-template-columns:minmax(0,1fr) min(593px,52%);gap:40px;align-items:center}
.pl-pine-copy{container-type:inline-size;min-width:0}
.pl-fold3 .pl-h2{font-size:min(var(--t-h2),6.5cqi);max-width:none}
.pl-fold3 .pl-h2 span{white-space:nowrap}
.pl-fold3 .pl-lead{font-size:var(--t-lead);line-height:1.6;margin-top:clamp(12px,2vh,20px);max-width:none}
.pl-fold3 .pl-lead strong{color:var(--pine);font-weight:600}
.pl-does-list{margin-top:clamp(16px,3vh,32px);border-top:1px solid var(--line)}
.pl-does-list li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;align-items:start;padding:clamp(12px,2.1vh,20px) 0;border-bottom:1px solid var(--line)}
.pl-does-ic{width:40px;height:40px;border-radius:11px;background:#E8F5EE;color:var(--pine);display:grid;place-items:center}
.pl-does-list strong{display:block;font-size:var(--t-title);font-weight:600;color:var(--ink);line-height:1.35}
.pl-does-list li > span:last-child > span{display:block;margin-top:4px;font-size:var(--t-body);line-height:1.55;color:var(--muted)}

/* Collage: Slack (focus) with WhatsApp and Gmail */
.pl-collage{position:relative;width:770px;height:560px}
.pl-collage-slack{position:absolute;left:108px;top:84px;width:610px;height:396px;z-index:1}
.pl-collage-wa{position:absolute;left:0;bottom:0;width:168px;height:350px;z-index:2;transform:scale(.8);transform-origin:bottom left}
.pl-collage-gm{position:absolute;right:0;top:0;width:290px;height:246px;z-index:2}

/* Slack */
.pl-slack{height:100%;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:#fff;font-family:Lato,'Helvetica Neue',Arial,sans-serif;color:#1D1C1D;box-shadow:0 1px 3px rgba(0,0,0,.08),0 18px 44px -18px rgba(29,28,29,.35);border:1px solid #DDDDDD}
.pl-slack-top{flex:none;height:30px;background:#350D36;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.pl-slack-dots{display:flex;gap:5px}
.pl-slack-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.pl-slack-search{display:inline-flex;align-items:center;gap:6px;width:46%;height:20px;padding:0 8px;border-radius:5px;background:rgba(255,255,255,.18);color:rgba(255,255,255,.75);font-size:10.5px}
.pl-slack-me{width:20px;height:20px;border-radius:5px;background:#E4D3B4;color:#6B4E1F;font-size:8.5px;font-weight:700;display:grid;place-items:center}
.pl-slack-body{flex:1;min-height:0;display:grid;grid-template-columns:128px minmax(0,1fr)}
.pl-slack-side{background:#3F0E40;color:#CFC3CF;padding:10px 0;display:flex;flex-direction:column;gap:1px;font-size:11.5px}
.pl-slack-ws{color:#fff;font-size:13px;font-weight:900;padding:0 12px 8px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:6px}
.pl-slack-sec{padding:6px 12px 3px;font-size:10.5px;color:#BCABBC}
.pl-slack-ch,.pl-slack-dm{display:flex;align-items:center;gap:6px;padding:3px 12px;white-space:nowrap;overflow:hidden}
.pl-slack-ch.is-active{background:#1164A3;color:#fff;font-weight:700}
.pl-slack-ch.is-unread{color:#fff;font-weight:700}
.pl-slack-mini{width:12px;height:12px;border-radius:3px;flex:none}
.pl-slack-mini.is-pine{background:#173A2C}
.pl-slack-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.pl-slack-head{flex:none;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #E2E2E2;font-size:13.5px}
.pl-slack-members{display:inline-flex;align-items:center;gap:0;font-size:11px;color:#616061;border:1px solid #DDDDDD;border-radius:5px;padding:2px 6px}
.pl-slack-members i{width:13px;height:13px;border-radius:3px;border:1.5px solid #fff;margin-left:-4px}
.pl-slack-members i:first-child{margin-left:0}
.pl-slack-msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 0 4px}
.pl-smsg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:9px;padding:5px 14px;animation:plRise .35s cubic-bezier(.2,.7,.2,1) both}
.pl-smsg p{font-size:12.5px;line-height:1.45}
.pl-sav{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:800}
.pl-sav.is-pine{background:#173A2C}
.pl-smeta{display:flex;align-items:baseline;gap:6px;font-size:12.5px;line-height:1.3}
.pl-smeta b{font-weight:900}
.pl-smeta span{font-size:10.5px;color:#616061}
.pl-smeta .pl-sapp{font-size:8.5px;font-weight:700;color:#616061;background:#E8E8E8;border-radius:3px;padding:1px 4px;letter-spacing:.02em}
.pl-smention{background:#E8F5FA;color:#1264A3;border-radius:3px;padding:0 2px;font-weight:600}
.pl-slist{list-style:disc !important;padding-left:18px !important;margin-top:3px;display:grid;gap:2px}
.pl-slist li{font-size:12.5px;line-height:1.45}
.pl-sattach{margin-top:6px;padding:3px 0 3px 10px;border-left:4px solid #DDDDDD;display:flex;flex-direction:column;font-size:12px;line-height:1.35}
.pl-sattach span{color:#616061;font-size:11.5px}
.pl-sreacts{display:flex;gap:5px;margin-top:6px;animation:plFade .3s ease both}
.pl-sreacts span{font-size:11px;padding:1px 7px;border-radius:999px;background:#F8F8F8;border:1px solid #E8E8E8;color:#1D1C1D}
.pl-sreacts span.is-mine{background:#E8F5FA;border-color:#1D9BD1;color:#1264A3}
.pl-slack-compose{flex:none;margin:0 14px;border:1px solid #BBBABB;border-radius:7px;padding:7px 10px 5px;display:flex;flex-direction:column;gap:6px}
.pl-slack-input{font-size:12px;color:#868686}
.pl-slack-tools{display:flex;align-items:center;gap:10px;color:#616061}
.pl-slack-send{margin-left:auto;width:22px;height:18px;border-radius:4px;background:#007A5A;color:#fff;display:grid;place-items:center}
.pl-slack-typing{flex:none;height:20px;padding:2px 14px 0;font-size:10.5px;color:#616061}

/* WhatsApp */
.pl-wa{height:100%;display:flex;flex-direction:column;border-radius:24px;border:6px solid #111B21;background:#EFEAE2;overflow:hidden;font-family:Roboto,'Helvetica Neue',Arial,sans-serif;color:#111B21;box-shadow:0 22px 44px -18px rgba(0,0,0,.45)}
.pl-wa-status{flex:none;height:16px;background:#008069;color:#fff;font-size:8.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.pl-wa-sig{display:flex;gap:2px;align-items:flex-end}
.pl-wa-sig i{width:2px;background:#fff;border-radius:1px}
.pl-wa-sig i:nth-child(1){height:4px}.pl-wa-sig i:nth-child(2){height:6px}.pl-wa-sig i:nth-child(3){height:8px}
.pl-wa-head{flex:none;height:38px;background:#008069;color:#fff;display:flex;align-items:center;gap:6px;padding:0 8px}
.pl-wa-av{width:24px;height:24px;border-radius:50%;background:#173A2C;display:grid;place-items:center;flex:none}
.pl-wa-who{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0}
.pl-wa-who b{font-size:11.5px}
.pl-wa-who span{font-size:9px;opacity:.85}
.pl-wa-acts{display:flex;gap:9px}
.pl-wa-chat{flex:1;min-height:0;overflow:hidden;justify-content:flex-end;padding:8px 8px 4px;display:flex;flex-direction:column;gap:5px;background-color:#EFEAE2;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:9px 9px}
.pl-wa-date{align-self:center;font-size:8.5px;background:#fff;color:#54656F;border-radius:6px;padding:2px 7px;box-shadow:0 1px 0.5px rgba(11,20,26,.13)}
.pl-wa-bubble{align-self:flex-start;max-width:88%;background:#fff;border-radius:0 8px 8px 8px;padding:5px 7px 4px;box-shadow:0 1px 0.5px rgba(11,20,26,.13);position:relative}
.pl-wa-bubble p{font-size:10.5px;line-height:1.38}
.pl-wa-bubble.is-out{align-self:flex-end;background:#D9FDD3;border-radius:8px 0 8px 8px}
.pl-wa-time{display:flex;align-items:center;justify-content:flex-end;gap:2px;font-size:8px;color:#667781;margin-top:1px}
.pl-wa-bubble.is-out .pl-wa-time svg{color:#53BDEB}
.pl-wa-btns{align-self:flex-start;width:88%;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pl-wa-btn{height:22px;border:0;border-radius:7px;background:#fff;color:#027EB5;font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;box-shadow:0 1px 0.5px rgba(11,20,26,.13)}
.pl-wa-btn.is-done{color:#008069}
.pl-wa-compose{flex:none;display:flex;align-items:center;gap:5px;padding:5px 6px 7px;background:#EFEAE2}
.pl-wa-input{flex:1;height:24px;border-radius:999px;background:#fff;display:flex;align-items:center;gap:5px;padding:0 8px;font-size:10px;color:#8696A0}
.pl-wa-mic{width:24px;height:24px;border-radius:50%;background:#00A884;color:#fff;display:grid;place-items:center;flex:none}

/* Gmail */
.pl-gm{height:100%;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:#F6F8FC;font-family:Roboto,'Helvetica Neue',Arial,sans-serif;color:#1F1F1F;border:1px solid #DADCE0;box-shadow:0 22px 44px -20px rgba(60,64,67,.45)}
.pl-gm-top{flex:none;display:flex;align-items:center;gap:7px;padding:8px 10px;color:#444746}
.pl-gm-logo{width:18px;height:auto;display:block}
.pl-gm-brand{font-size:14px;color:#5F6368;letter-spacing:-.01em;margin-right:4px}
.pl-gm-search{flex:1;display:flex;align-items:center;gap:5px;height:22px;border-radius:999px;background:#EAF1FB;padding:0 8px;font-size:9.5px;color:#5F6368}
.pl-gm-body{flex:1;min-height:0;display:grid;grid-template-columns:34px minmax(0,1fr)}
.pl-gm-rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0 8px}
.pl-gm-compose{width:26px;height:26px;border-radius:8px;background:#C2E7FF;color:#001D35;display:grid;place-items:center;box-shadow:0 1px 2px rgba(60,64,67,.2)}
.pl-gm-railitem{position:relative;width:24px;height:20px;border-radius:999px;display:grid;place-items:center;color:#444746}
.pl-gm-railitem.is-active{background:#D3E3FD;color:#001D35}
.pl-gm-railitem i{position:absolute;top:-4px;right:-5px;min-width:12px;height:12px;border-radius:999px;background:#EA4335;color:#fff;font-style:normal;font-size:7.5px;font-weight:700;display:grid;place-items:center;padding:0 2px}
.pl-gm-mail{margin:0 8px 8px 0;background:#fff;border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;min-height:0}
.pl-gm-subj{display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.25}
.pl-gm-label{font-size:8.5px;background:#DDDDDD;color:#444746;border-radius:3px;padding:1px 4px}
.pl-gm-from{display:flex;align-items:center;gap:6px;font-size:10px}
.pl-gm-av{width:20px;height:20px;border-radius:50%;background:#173A2C;display:grid;place-items:center;flex:none}
.pl-gm-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-gm-name span{color:#5E5E5E}
.pl-gm-time{font-size:9px;color:#5E5E5E}
.pl-gm-text{font-size:10.5px;line-height:1.45;color:#222}
.pl-gm-chips{display:flex;flex-wrap:wrap;gap:4px}
.pl-gm-chips span{font-size:8.5px;font-weight:600;border-radius:999px;padding:2px 7px}
.pl-gm-chips .is-red{background:#FCE8E6;color:#C5221F}
.pl-gm-chips .is-yellow{background:#FEF7E0;color:#B06000}
.pl-gm-chips .is-green{background:#E6F4EA;color:#137333}
.pl-gm-btn{align-self:flex-start;margin-top:auto;height:24px;padding:0 12px;border-radius:999px;border:0;background:#0B57D0;color:#fff;font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer}
.pl-gm-btn.is-done{background:#C2E7FF;color:#001D35}.pl-gm-btn.is-done{background:#C2E7FF;color:#001D35}


/* Why now */
.pl-dark{background:var(--pine);color:#E7EDE8}
.pl-dark .pl-h2{color:#fff}
.pl-dark .pl-lead{color:rgba(231,237,232,.78)}
.pl-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:48px;margin-top:72px}
.pl-stat{border-top:1px solid rgba(255,255,255,.18);padding:28px 0 48px;display:flex;flex-direction:column}
.pl-stat-n{font-family:var(--serif);font-size:clamp(46px,4.6vw,64px);line-height:1;letter-spacing:-0.02em;color:#F2D6A6;font-variant-numeric:lining-nums}
.pl-stat-t{font-size:var(--fs-ui);line-height:1.55;margin-top:16px;color:#E7EDE8;max-width:22em}
.pl-stat-s{margin-top:14px;font-size:13px;color:rgba(231,237,232,.6);text-decoration:underline;text-decoration-color:rgba(231,237,232,.3);text-underline-offset:3px}
.pl-stat-s:hover{color:#fff;text-decoration-color:#fff}
.pl-dark-close{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.2vw,28px);line-height:1.35;color:#fff;margin-top:24px;max-width:28em}

/* Challenges */
.pl-pairs{margin-top:64px}
.pl-pairs-head,.pl-pair{display:grid;grid-template-columns:128px minmax(0,1fr) 32px minmax(0,1.2fr);gap:28px}
.pl-pairs-head{padding:0 0 14px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--pine)}
.pl-pair{padding:28px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pl-pair-k{font-size:14px;font-weight:700;color:var(--alert)}
.pl-pair-says{font-family:var(--serif);font-size:clamp(20px,1.7vw,24px);line-height:1.3;color:var(--faint)}
.pl-pairs-mid{color:var(--resin);display:flex;justify-content:center;align-self:start;padding-top:6px}
.pl-pair-real{font-size:clamp(16px,1.25vw,18px);line-height:1.55;color:var(--ink)}
.pl-pairs-note{margin-top:20px;font-size:13px;color:var(--faint)}

/* How it works */
.pl-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px;margin-top:72px;counter-reset:none}
.pl-steps li{position:relative;padding-top:28px;border-top:2px solid var(--pine)}
.pl-step-n{font-family:var(--serif);font-size:44px;line-height:1;color:var(--resin)}
.pl-steps h3{font-family:var(--serif);font-weight:400;font-size:clamp(24px,2vw,28px);color:var(--pine);margin-top:14px;line-height:1.15}
.pl-steps p{font-size:var(--fs-ui);color:var(--muted);margin-top:10px;line-height:1.55}
.pl-feature{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:center;padding:88px 0 0;margin-top:88px;border-top:1px solid var(--line)}
.pl-feature.is-flip{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.pl-feature.is-flip .pl-feature-text{order:2}
.pl-feature-text > p{font-size:var(--fs-body);color:var(--muted);margin-top:18px;line-height:1.6;max-width:30em}
.pl-points{margin-top:24px;display:grid;gap:12px}
.pl-points li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;font-size:var(--fs-ui);line-height:1.5;color:var(--ink)}
.pl-points svg{color:var(--pine);margin-top:3px}
.pl-feature-visual{min-width:0}

/* Dashboard screen */
.pl-dash{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;background:#F8FBF9}
.pl-dash-card{min-width:0}
.pl-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-2);border-radius:10px;background:#fff;overflow:hidden}
.pl-kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.pl-kpi:nth-child(3n){border-right:0}
.pl-kpi:nth-child(n+4){border-bottom:0}
.pl-kpi-l{font-size:12px;color:var(--muted)}
.pl-kpi-v{font-size:22px;font-weight:600;letter-spacing:-0.01em;color:var(--ink);line-height:1.2}
.pl-kpi-d{font-size:12px;font-weight:600}
.pl-kpi-d.is-up{color:var(--ok)} .pl-kpi-d.is-down{color:var(--alert)} .pl-kpi-d.is-flat{color:var(--muted);font-weight:500}
.pl-dash-card{background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:14px}
.pl-dash-card-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.pl-dash-card-h strong{font-size:14px}
.pl-lines{width:100%;height:auto;display:block}
.pl-axis{font-family:var(--sans);font-size:11px;fill:var(--faint)}
.pl-axis-note{fill:var(--muted);font-style:italic}
.pl-line-lab{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.pl-line-val{font-weight:400;fill:var(--muted)}
.pl-margins{display:grid;gap:10px;margin-top:4px}
.pl-margin-row{display:grid;grid-template-columns:118px minmax(0,1fr) 48px 104px;gap:12px;align-items:center;font-size:13px}
.pl-margin-n{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pl-swatch{width:9px;height:9px;border-radius:2px;flex:none}
.pl-margin-bar{height:8px;background:var(--line-2);border-radius:999px;overflow:hidden}
.pl-margin-bar span{display:block;height:100%;border-radius:999px}
.pl-margin-v{font-weight:700;text-align:right}
.pl-margin-s{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}

/* Investigation screen */
.pl-inv{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;background:#fff}
.pl-causes{margin-top:12px;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.pl-causes li{padding:12px 14px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.pl-causes li:first-child{border-top:0;background:#FBFDFC}
.pl-cause-h{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.pl-cause-h strong{font-weight:600}
.pl-cause-sub{padding-left:32px}
.pl-evidence{display:flex;align-items:center;gap:12px;padding-left:32px;flex-wrap:wrap}
.pl-thumbs{display:inline-flex;gap:4px}
.pl-thumb{width:28px;height:28px;border-radius:5px;background:#E6EDE8;color:var(--pine-2);display:grid;place-items:center}
.pl-thumb.is-gone{background:repeating-linear-gradient(45deg,#F7E4DD 0 4px,#FBF1ED 4px 8px);color:var(--alert);opacity:.8}
.pl-evidence .pl-sub{flex:1;min-width:180px}
.pl-next{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border-radius:10px;background:var(--resin-soft);font-size:13.5px}
.pl-next-l{font-weight:700;color:var(--resin-ink)}
.pl-next > span:nth-child(2){flex:1;min-width:200px}

/* Stock screen */
.pl-stock{background:#fff}
.pl-table-wrap{overflow-x:auto}
.pl-table{width:100%;border-collapse:collapse;font-size:13px;min-width:540px}
.pl-table th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:12px 12px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.pl-table td{padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.pl-table th:first-child,.pl-table td:first-child{padding-left:16px}
.pl-table th:last-child,.pl-table td:last-child{padding-right:16px}
.pl-table .is-num{text-align:right}
.pl-td-p{font-weight:600}
.pl-cover{display:inline-flex;align-items:center;gap:8px}
.pl-cover-bar{width:44px;height:6px;border-radius:999px;background:var(--line-2);overflow:hidden;display:inline-block}
.pl-cover-bar span{display:block;height:100%;border-radius:999px}
.pl-cover-bar .is-ok{background:var(--ok)} .pl-cover-bar .is-warn{background:var(--resin)} .pl-cover-bar .is-alert{background:var(--alert)} .pl-cover-bar .is-info{background:var(--info)}
.pl-cover-v{min-width:52px}
.pl-attn{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px 16px;background:#F8FBF9}
.pl-attn-item{background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pl-attn-item p{font-size:13px;line-height:1.5}

/* Work screen */
.pl-work{padding:16px;background:#fff}
.pl-ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--paper);padding:4px;border-radius:10px}
.pl-rung{font-family:var(--sans);font-size:12px;font-weight:600;text-align:center;padding:8px 6px;border-radius:7px;border:0;background:transparent;color:var(--faint);line-height:1.3;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.pl-rung:hover{color:var(--pine)}
.pl-rung.is-past{color:var(--pine-2)}
.pl-rung.is-current,.pl-rung.is-current:hover{background:var(--pine);color:#fff}
.pl-ladder-note{font-size:12.5px;color:var(--muted);margin-top:10px}
.pl-work-list{margin-top:12px;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.pl-work-item{display:grid;grid-template-columns:10px minmax(0,1fr) auto 72px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-2)}
.pl-work-item:first-child{border-top:0}
.pl-work-t strong{font-size:13.5px;font-weight:600;display:block;line-height:1.35}
.pl-work-item .pl-mini-btn{justify-content:center}
.pl-work-spacer{width:72px}
.pl-wdot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pl-wdot.is-wait{background:var(--pine)} .pl-wdot.is-warn{background:var(--resin)} .pl-wdot.is-ok{background:var(--ok)} .pl-wdot.is-info{background:var(--info)}

/* Routine screen */
.pl-routine{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);background:#fff}
.pl-routine-main{padding:18px;display:flex;flex-direction:column;gap:10px}
.pl-field-l{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.pl-routine-q{padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;background:#FBFDFC;font-size:16px}
.pl-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl-fields > div{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.pl-field-v{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-top:2px;color:var(--ink)}
.pl-field-v svg{color:var(--pine);flex:none}
.pl-memory{background:#F4F9F6;border-left:1px solid var(--line-2);padding:18px}
.pl-memory ul{margin-top:10px;display:grid;gap:8px}
.pl-memory li{font-size:13px;line-height:1.45;background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}

/* Benefits */
.pl-benefits{margin-top:128px;padding-top:80px;border-top:1px solid var(--line)}
.pl-benefits-quote{font-family:var(--serif);font-size:clamp(28px,3.2vw,42px);line-height:1.2;letter-spacing:-0.01em;color:var(--pine);max-width:22em;text-wrap:balance}
.pl-roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px;margin-top:64px}
.pl-role{padding-top:24px;border-top:1px solid var(--line)}
.pl-trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:64px}
.pl-trust li{display:flex;align-items:center;gap:12px;padding:16px 18px;background:#fff;border:1px solid var(--line-2);border-radius:12px;box-shadow:0 1px 2px rgba(15,42,31,.04),0 8px 20px -14px rgba(15,42,31,.16);font-size:var(--fs-small);font-weight:600;color:var(--ink);line-height:1.35}
.pl-trust svg{color:var(--resin);flex:none}

/* Demo */
.pl-demo{background:#FFFFFF}
.pl-demo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:80px;align-items:start}
.pl-pilot{margin-top:40px;display:grid;gap:16px}
.pl-pilot li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;font-size:var(--fs-body);line-height:1.55;align-items:start}
.pl-pilot li span{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--pine);color:var(--pine);font-family:var(--serif);font-size:17px;line-height:1}
.pl-form-card{background:#fff;border:1px solid #E1E5DF;border-radius:18px;padding:28px;box-shadow:0 1px 2px rgba(15,42,31,.05),0 12px 32px -12px rgba(15,42,31,.14),0 32px 64px -40px rgba(15,42,31,.24)}
.pl-toggle{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--paper);border-radius:999px}
.pl-toggle button{height:40px;border-radius:999px;border:0;background:transparent;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:background-color .2s,color .2s}
.pl-toggle button.is-on{background:var(--pine);color:#fff}
.pl-form-intro{font-size:15px;color:var(--muted);margin-top:16px}
.pl-form{display:grid;gap:14px;margin-top:20px}
.pl-form label{display:grid;gap:6px}
.pl-form label > span{font-size:13.5px;font-weight:600;color:var(--ink)}
.pl-form em{font-style:normal;font-weight:400;color:var(--faint)}
.pl-form input,.pl-form textarea{width:100%;font:inherit;font-size:15.5px;color:var(--ink);background:#FBFDFC;border:1px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .15s,background-color .15s}
.pl-form textarea{resize:vertical;min-height:88px;line-height:1.5}
.pl-form input::placeholder,.pl-form textarea::placeholder{color:#A3AAA5}
.pl-form input:focus,.pl-form textarea:focus{outline:none;border-color:var(--pine);background:#fff;box-shadow:0 0 0 3px rgba(23,58,44,.12)}
.pl-error{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--alert);background:var(--alert-soft);border-radius:8px;padding:10px 12px}
.pl-form-foot{font-size:13.5px;color:var(--muted);text-align:center}
.pl-form-foot a{color:var(--pine);font-weight:600}
.pl-sent{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:12px 0}
.pl-sent h3{font-family:var(--serif);font-weight:400;font-size:32px;color:var(--pine)}
.pl-sent p{font-size:16px;color:var(--muted)}

/* Footer */
.pl-footer{background:var(--pine-deep);color:rgba(231,237,232,.72);padding:80px 0 36px;font-size:15px}
.pl-foot-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,.8fr);gap:48px;align-items:start}
.pl-foot-tag{font-family:var(--serif);font-style:italic;font-size:22px;color:#fff;margin-top:14px}
.pl-foot-by{margin-top:10px;font-size:14px}
.pl-foot-by a{color:#fff}
.pl-footer h4{font-size:14px;font-weight:600;color:#fff;margin:0 0 14px}
.pl-footer a{text-decoration:none}
.pl-foot-grid > div > a{display:block;margin-bottom:8px}
.pl-footer a:hover{color:#fff}
.pl-footer address{font-style:normal;line-height:1.7}
.pl-foot-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:64px;padding-top:24px;border-top:1px solid rgba(255,255,255,.12);font-size:13.5px}

/* Compact hero summary (small screens only) */
.pl-wf-compact{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.pl-wf-compact div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:#F8FBF9;border:1px solid var(--line-2)}
.pl-wf-compact span{font-size:12px;color:var(--muted)}
.pl-wf-compact strong{font-size:22px;font-weight:600;color:var(--pine);line-height:1.2}
.pl-wf-compact em{font-style:normal;font-size:12px;font-weight:600;line-height:1.35}
.pl-wf-compact .is-up{color:var(--ok)} .pl-wf-compact .is-down{color:var(--alert)}


/* Fold 2: replay the product sequence like a GIF */
.pl-ws.pl-anim .pl-ws-main{animation:plFadeOut .4s ease 9.1s both}
@keyframes plFadeOut{to{opacity:0}}

/* Fold 4: why now + what brands face */
.pl-fold4{min-height:calc(100svh - 72px);display:flex;flex-direction:column;justify-content:center;padding:clamp(18px,3vh,44px) 0}
.pl-kicker{font-size:var(--t-title);font-weight:700;color:var(--pine-2);margin-bottom:clamp(12px,2vh,18px)}
.pl-f4{container-type:inline-size}
.pl-fold4 .pl-h2{font-size:var(--t-h2);max-width:none}
.pl-f4-h2{font-size:min(var(--t-h2),3.6cqi) !important;white-space:nowrap}
.pl-fold4 .pl-pairs{margin-top:clamp(24px,4vh,40px)}
.pl-fold4 .pl-pairs-head,.pl-fold4 .pl-pair{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) 28px minmax(0,1.5fr);column-gap:24px;align-items:center}
.pl-fold4 .pl-pairs-head{padding-bottom:8px;font-size:var(--t-body);font-weight:700;color:var(--ink);border-bottom:2px solid var(--pine)}
.pl-fold4 .pl-pair{padding:clamp(11px,1.9vh,15px) 0;border-bottom:1px solid var(--line)}
.pl-fold4 .pl-pair-k,.pl-fold4 .pl-pair-says,.pl-fold4 .pl-pair-real{font-family:var(--sans);font-size:var(--t-body);line-height:1.45}
.pl-fold4 .pl-pair-k{font-weight:700;color:var(--pine)}
.pl-fold4 .pl-pair-says{font-weight:400;color:var(--muted)}
.pl-fold4 .pl-pair-real{font-weight:600;color:var(--ink)}
.pl-fold4 .pl-pairs-mid{padding-top:0;justify-content:center;color:var(--resin)}
.pl-f4-callout{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:clamp(26px,4.4vh,44px);font-family:var(--serif);font-weight:600;font-size:var(--t-h3);line-height:1.3;color:var(--pine);text-align:center}
.pl-f4-callout svg{flex:none;color:#D92D20}
.pl-fold4 .pl-pairs-note{margin-top:8px;font-size:11px;color:#A3ACA7}

/* Fold 5: how it works (heading, lead) + hover panel led by the product screen */
.pl-fold5{padding:clamp(18px,3vh,40px) 0}
.pl-f5{display:flex;flex-direction:column;gap:clamp(14px,2.4vh,24px)}
.pl-f5-head{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,12px)}
.pl-f5-head .pl-h2{font-size:var(--t-h2);max-width:none;text-wrap:wrap}
.pl-f5-head .pl-lead{margin-top:0;font-size:var(--t-lead);line-height:1.55;max-width:none}
.pl-tabs{display:grid;grid-template-columns:minmax(0,.3fr) minmax(0,.7fr);background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(6,40,26,.04),0 16px 40px -28px rgba(6,40,26,.24)}
.pl-tabs-list{display:flex;flex-direction:column;border-right:1px solid var(--line-2);min-height:0}
.pl-tab{flex:1 1 0;display:grid;grid-template-columns:26px minmax(0,1fr) 16px;column-gap:10px;align-items:center;text-align:left;padding:10px 16px 10px 15px;background:#fff;border:0;border-bottom:1px solid var(--line-2);border-left:3px solid transparent;cursor:pointer;font-family:var(--sans);color:var(--ink);transition:background-color .2s ease,border-color .2s ease}
.pl-tab:last-child{border-bottom:0}
.pl-tab:hover{background:#F5FAF7}
.pl-tab.is-on{background:#EAF6EF;border-left-color:var(--pine)}
.pl-tab-n{font-size:var(--t-micro);font-weight:700;color:var(--resin-ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pl-tab-txt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.pl-tab-txt strong{font-size:var(--t-title);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pl-tab.is-on .pl-tab-txt strong{color:var(--pine)}
.pl-tab-arrow{color:var(--pine);opacity:0;transform:translateX(-4px);transition:opacity .2s ease,transform .2s ease}
.pl-tab.is-on .pl-tab-arrow{opacity:1;transform:none}
.pl-soon{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--resin);color:#fff;font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pl-tabs-panel{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:clamp(14px,2.4vh,24px) clamp(18px,2vw,28px);background:#FFFFFF}
.pl-ps-wrap{display:flex;flex-direction:column;gap:14px;width:fit-content;max-width:100%}
.pl-ps-wrap > .pl-fit{animation:plFade .3s ease both}
.pl-tabs-screen-in{width:640px}
.pl-tabs-pts{width:0;min-width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pl-tabs-pts li{display:flex;align-items:center;gap:7px;font-size:var(--t-small);font-weight:500;color:var(--muted);line-height:1.35}
.pl-tabs-pts li:nth-child(2){justify-content:center}
.pl-tabs-pts li:nth-child(3){justify-content:flex-end}
.pl-dot-tick{width:16px;height:16px;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;flex:none}

/* Fold 5 product screens: shared template */
.pl-ps{height:334px;padding:16px;display:flex;flex-direction:column;gap:12px;background:#fff;font-family:var(--sans);font-size:13px;line-height:1.4;color:var(--ink);text-align:left}
.pl-ps-label{font-size:11px;font-weight:600;color:var(--muted)}
.pl-ps-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pl-ps-kpis.is-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pl-ps-kpi{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:#fff}
.pl-ps-v{font-size:20px;font-weight:700;line-height:1.15;color:var(--ink)}
.pl-ps-d{font-size:11px;font-weight:600}
.pl-ps-d.is-up{color:var(--ok)} .pl-ps-d.is-down{color:var(--alert)} .pl-ps-d.is-flat{color:var(--muted)}
.pl-ps-card{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line-2);border-radius:10px;background:#fff}
.pl-ps-grow{flex:1;min-height:0}
.pl-ps-chart{flex:1;min-height:0}
.pl-ps-chart svg{width:100%;height:100%;display:block}
.pl-ps-q{align-self:flex-end;padding:8px 12px;border-radius:12px 12px 4px 12px;background:var(--pine);color:#fff;font-weight:500}
.pl-ps-a{display:flex;align-items:center;gap:10px}
.pl-ps-a p{font-weight:500;color:var(--ink)}
.pl-ps-list{border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.pl-ps-list li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line-2)}
.pl-ps-list li:first-child{border-top:0}
.pl-ps-list li.is-work{grid-template-columns:minmax(0,1fr) auto 76px}
.pl-ps-list li.is-work .pl-mini-btn{justify-content:center}
.pl-ps-n{width:22px;height:22px;border-radius:50%;background:var(--paper);color:var(--pine);font-size:11px;font-weight:700;display:grid;place-items:center}
.pl-ps-t{font-weight:600;color:var(--ink)}
.pl-ps-tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pl-ps-tag.is-ok{background:var(--ok-soft);color:var(--ok)}
.pl-ps-tag.is-warn{background:var(--resin-soft);color:var(--resin-ink)}
.pl-ps-tag.is-alert{background:var(--alert-soft);color:var(--alert)}
.pl-ps-tag.is-info{background:var(--info-soft);color:var(--info)}
.pl-ps-tag.is-muted{background:var(--paper);color:var(--muted)}
.pl-ps-tag.is-pine{background:var(--pine);color:#fff}
.pl-ps-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px;background:var(--paper);font-weight:500;color:var(--ink)}
.pl-ps-banner{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--resin-soft);color:var(--resin-ink);font-weight:600}
.pl-ps-table{width:100%;border-collapse:collapse}
.pl-ps-table th{padding:0 10px 8px;border-bottom:1px solid var(--line-2);text-align:left;font-size:11px;font-weight:600;color:var(--muted)}
.pl-ps-table td{padding:10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.pl-ps-table tr:last-child td{border-bottom:0}
.pl-ps-cover{display:inline-flex;align-items:center;gap:8px}
.pl-ps-bar{width:60px;height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.pl-ps-bar span{display:block;height:100%;border-radius:999px}
.pl-ps-bar .is-ok{background:var(--ok)} .pl-ps-bar .is-warn{background:var(--resin)} .pl-ps-bar .is-alert{background:var(--alert)} .pl-ps-bar .is-info{background:var(--info)}
.pl-ps-rows li{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line-2)}
.pl-ps-rows li:first-child{border-top:0}
.pl-ps-rows .pl-ps-d{font-size:13px}
.pl-ps-ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:10px;background:var(--paper)}
.pl-ps-ladder button{height:30px;border:0;border-radius:7px;background:transparent;font-family:var(--sans);font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.pl-ps-ladder button.is-on{background:var(--pine);color:#fff}

/* Fold 6: built for + closing statement */
.pl-fold6{min-height:calc(100svh - 72px);display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,5vh,64px) 0}
.pl-fold6 .pl-h2{font-size:var(--t-h2);max-width:none}
.pl-f6-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(36px,5vw,72px);align-items:center}
.pl-f6-left{min-width:0}
.pl-fold6 .pl-roles{display:flex;flex-direction:column;margin-top:clamp(18px,3.4vh,32px);border-top:1px solid var(--line-2)}
.pl-fold6 .pl-role{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;align-items:start;padding:clamp(14px,2.4vh,22px) 0;border-bottom:1px solid var(--line-2)}
.pl-role-ic{flex:none;width:40px;height:40px;border-radius:11px;background:#E8F5EE;color:var(--pine);display:grid;place-items:center}
.pl-fold6 .pl-role h3{margin:0;font-family:var(--sans);font-size:var(--t-title);font-weight:600;color:var(--ink);line-height:1.35}
.pl-fold6 .pl-role p{margin-top:4px;font-size:var(--t-body);line-height:1.55;color:var(--muted)}
.pl-f6-close{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(14px,2.4vh,20px);padding:clamp(26px,4.6vh,44px) clamp(24px,2.8vw,40px);background:#F4FAF7;border:1px solid var(--line-2);border-radius:20px}
.pl-f6-quote{font-family:var(--serif);font-weight:600;font-size:clamp(22px,min(1.9vw,3.3vh),30px);line-height:1.25;letter-spacing:-0.01em;color:var(--pine)}
.pl-f6-sub{font-size:var(--t-body);line-height:1.6;color:var(--muted)}
.pl-f6-close .pl-btn{margin-top:4px}

/* FAQ */
.pl-faq-sec{min-height:calc(100svh - 72px);display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,4.5vh,72px) 0;border-top:1px solid var(--line-2)}
.pl-faq-sec > .pl-wrap{width:100%}
.pl-faq-grid{display:grid;grid-template-columns:minmax(0,.4fr) minmax(0,.6fr);gap:clamp(32px,4vw,64px);align-items:start}
.pl-faq-intro{position:sticky;top:96px}
.pl-faq-intro .pl-h2{font-size:var(--t-h2);max-width:none}
.pl-faq-intro .pl-lead{font-size:var(--t-lead);margin-top:12px;max-width:none}
.pl-faq-intro .pl-btn{margin-top:18px}
.pl-faq{border-top:2px solid var(--pine)}
.pl-faq-item{border-bottom:1px solid var(--line)}
.pl-faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(14px,2.2vh,18px) 0;background:none;border:0;cursor:pointer;text-align:left;font-family:var(--sans);font-size:var(--t-title);font-weight:600;color:var(--ink);line-height:1.4}
.pl-faq-q:hover{color:var(--pine)}
.pl-faq-ic{flex:none;width:28px;height:28px;border-radius:50%;background:#E8F5EE;color:var(--pine);display:grid;place-items:center;transition:transform .25s ease,background-color .2s ease,color .2s ease}
.pl-faq-item.is-open .pl-faq-ic{transform:rotate(45deg);background:var(--pine);color:#fff}
.pl-faq-a{padding:0 44px clamp(14px,2.2vh,18px) 0}
.pl-faq-a p{font-size:var(--t-body);line-height:1.6;color:var(--muted)}

/* ----------------------- Responsive ----------------------- */
@media (min-width:981px){
  .pl-fold5{height:calc(100svh - 72px);min-height:560px;display:flex}
  .pl-f5-wrap{display:flex;flex-direction:column;width:100%}
  .pl-f5{flex:1;min-height:0}
  .pl-tabs{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
}
@media (max-width:1120px){
  .pl-ws{grid-template-columns:188px minmax(0,1fr)}
  .pl-ws-today{display:none}
  .pl-trust{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pl-roles{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 48px}
}
@media (max-width:980px){
  .pl-nav-links{display:none}
  .pl-menu-btn{display:inline-flex}
  .pl-mobile-menu{display:grid;gap:4px;padding:8px 24px 20px;border-top:1px solid var(--line);background:var(--paper)}
  .pl-mobile-menu a{padding:12px 0;font-size:17px;color:var(--pine);text-decoration:none;border-bottom:1px solid var(--line-2)}
  .pl-hero{min-height:0}
  .pl-hero-main{grid-template-columns:1fr;gap:40px}
  .pl-hero-copy{padding:8px 0 0}
  .pl-trusted{flex-direction:column;align-items:flex-start;gap:20px}
  .pl-trusted-logos{width:100%}
  .pl-hero-visual{max-width:600px}
  .pl-hv{margin:0 auto;justify-content:center}
  .pl-hv-col{transform:none;max-width:100%}
  .pl-hv-insight p{white-space:normal;text-align:left}
  .pl-pine-grid,.pl-fold3 .pl-pine-grid{grid-template-columns:minmax(0,1fr);gap:40px}
  .pl-pine-visual{min-width:0}
  .pl-faq-grid{grid-template-columns:1fr}
  .pl-faq-intro{position:static}
  .pl-f6-grid{grid-template-columns:minmax(0,1fr);gap:32px}
  .pl-fold4,.pl-fold6{min-height:0}
  .pl-f4-grid{grid-template-columns:1fr;gap:32px}
  .pl-f5-steps{grid-template-columns:1fr;gap:10px}
  .pl-f5-steps li{justify-content:flex-start}
  .pl-tabs{grid-template-columns:1fr}
  .pl-tabs-list{border-right:0;border-bottom:1px solid var(--line-2)}
  .pl-fold3 .pl-h2 span{white-space:normal}
  .pl-f6-top{grid-template-columns:1fr;gap:28px}
  .pl-feature,.pl-feature.is-flip{grid-template-columns:1fr;gap:40px}
  .pl-feature.is-flip .pl-feature-text{order:0}
  .pl-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pl-steps{grid-template-columns:1fr;gap:32px}
  .pl-demo-grid{grid-template-columns:1fr;gap:48px}
  .pl-foot-grid{grid-template-columns:1fr 1fr}
  .pl-foot-brand{grid-column:1 / -1}
  .pl-does{grid-template-columns:1fr;gap:32px;margin-top:72px}
}
@media (max-width:760px){
  .pl-wrap{padding:0 20px}
  .pl-section{padding:88px 0}
  .pl-hero{padding-top:48px}
  .pl-hero-stage{padding-bottom:40px}
  .pl-showcase{min-height:0}
  .pl-fold3{min-height:0}
  .pl-trusted{gap:10px}
  .pl-trusted-logos img{height:26px}
  .pl-hv{padding:10px 10px 12px;border-radius:18px}
  .pl-trusted-logos{justify-content:flex-start;gap:20px 28px}
  .pl-hide-sm{display:none}
  .pl-ws{grid-template-columns:1fr;min-height:0}
  .pl-ws-side{display:none}
  .pl-ws-main{padding:16px}
  .pl-chips .pl-chip:nth-child(n+2){display:none}
  .pl-screen-meta .pl-chip{display:none}
  .pl-cause-h{grid-template-columns:22px minmax(0,1fr)}
  .pl-cause-h .pl-tag{grid-column:2;justify-self:start}
  .pl-evidence,.pl-cause-sub{padding-left:32px}
  .pl-driver{grid-template-columns:22px minmax(0,1fr)}
  .pl-driver-end{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px}
  .pl-traits > div{grid-template-columns:1fr;gap:6px}
  .pl-nudges{grid-template-columns:1fr}
  .pl-stats{grid-template-columns:1fr}
  .pl-stat{padding-bottom:36px}
  .pl-pairs-head{display:none}
  .pl-fold4 .pl-pairs-head{display:grid}
  .pl-fold4 .pl-pairs-head,.pl-fold4 .pl-pair{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:14px;row-gap:4px}
  .pl-fold4 .pl-pairs-head > span:first-child,.pl-fold4 .pl-pairs-head > span:nth-child(3),.pl-fold4 .pl-pairs-mid{display:none}
  .pl-fold4 .pl-pair-k{grid-column:1 / -1}
  .pl-fold4 .pl-pairs-head,.pl-fold4 .pl-pair-k,.pl-fold4 .pl-pair-says,.pl-fold4 .pl-pair-real{font-size:13px}
  .pl-f4-callout{font-size:18px}
  .pl-f4-h2{white-space:normal;font-size:var(--t-h2) !important}
  .pl-faq-grid{grid-template-columns:1fr}
  .pl-faq-intro{position:static}
  .pl-tabs-pts{grid-template-columns:1fr;gap:6px}
  .pl-tabs-pts li,.pl-tabs-pts li:nth-child(2),.pl-tabs-pts li:nth-child(3){justify-content:flex-start}
  .pl-pair{grid-template-columns:1fr;gap:6px;padding:24px 0}
  .pl-pairs-mid{display:none}
  .pl-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pl-kpi:nth-child(3n){border-right:1px solid var(--line-2)}
  .pl-kpi:nth-child(2n){border-right:0}
  .pl-kpi:nth-child(n+4){border-bottom:1px solid var(--line-2)}
  .pl-kpi:nth-child(n+5){border-bottom:0}
  .pl-margin-row{grid-template-columns:104px minmax(0,1fr) 44px}
  .pl-margin-s{display:none}
  .pl-attn{grid-template-columns:1fr}
  .pl-ladder{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pl-work-item{grid-template-columns:10px minmax(0,1fr);row-gap:8px}
  .pl-work-item .pl-status{grid-column:2;justify-self:start}
  .pl-work-item .pl-mini-btn{grid-column:2;justify-self:start}
  .pl-work-spacer{display:none}
  .pl-routine{grid-template-columns:1fr}
  .pl-memory{border-left:0;border-top:1px solid var(--line-2)}
  .pl-roles,.pl-trust{grid-template-columns:1fr}
  .pl-benefits{margin-top:88px;padding-top:56px}
  .pl-form-card{padding:20px}
  .pl-foot-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .pl-answer-card .pl-waterfall{display:none}
  .pl-wf-compact{display:grid}
  .pl-chart-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px 4px}
  .pl-chart-scroll .pl-lines{min-width:460px}
  .pl-msg-pine{gap:10px}
}
@media (max-width:420px){
  .pl-hv{padding:10px}
  .pl-nav-cta .pl-btn-primary{padding:0 14px}
  .pl-logo-word{font-size:22px}
  .pl-fields{grid-template-columns:1fr}
}
